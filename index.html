<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="flex min-h-screen items-center justify-center bg-sky-100 p-4 font-sans text-slate-800">
    <main class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-lg sm:p-8">
        <header class="text-center">
            <h1 class="text-2xl font-bold">Weather</h1>
         
        </header>

        <form id="search" action="#" method="get" class="mt-6 flex gap-2">
            <label for="city" class="sr-only">Search for a city</label>
            <input id="city" name="city" type="search" placeholder="Enter a city" class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
            <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white hover:bg-sky-700">Search</button>
        </form>
  <div id="respons"></div>
    </main>
   
</body>
<script src="app.js"></script>
</html>
